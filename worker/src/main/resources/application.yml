spring:
  application:
    name: worker
  main:
    web-application-type: none

app:
  amqp:
    connection:
      host: localhost
      port: 5672
      virtual-host: /
    oauth2:
      # Keycloak is HTTP behind Traefik at /auth. The AMQP 1.0 client fetches + refreshes the token itself.
      token-uri: http://localhost/auth/realms/amqp-demo/protocol/openid-connect/token
      client-id: worker
      # demo default; override with WORKER_CLIENT_SECRET (or a secrets manager) in production
      client-secret: "${WORKER_CLIENT_SECRET:worker-secret}"
      # Keycloak alias scopes (space-delimited); the broker expands them to read jobs.in + write result.* to results
      scope: "jobs_read results_write"
    exchanges:
      results: results
    queues:
      jobs-in: "jobs.in"
    routing-keys:
      result-ready: "result.ready"

logging:
  level:
    org.springframework.amqp: INFO
