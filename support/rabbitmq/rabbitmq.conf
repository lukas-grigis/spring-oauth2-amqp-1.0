## Authentication and authorization
##
## The OAuth2 plugin validates JWTs issued by Keycloak and authorizes operations
## based on the scopes carried in each token. The internal backend is kept as a
## fallback so the management UI stays usable with admin/admin.
auth_backends.1 = rabbit_auth_backend_internal
auth_backends.2 = rabbit_auth_backend_oauth2

## OAuth2 resource server identity. The broker also requires the token audience (aud) to contain
## this id ("rabbitmq"); Keycloak adds it via an audience protocol mapper (see support/keycloak).
## verify_aud defaults to true, so no explicit toggle is needed.
auth_oauth2.resource_server_id = rabbitmq

## The broker fetches Keycloak's signing keys (JWKS) to validate token signatures. The plugin requires an
## https JWKS URL, so the broker reaches Keycloak through Traefik, which terminates TLS with its built-in
## self-signed cert (Keycloak itself runs plain HTTP). Peer/hostname verification is disabled because that
## cert is self-signed and only used on the internal Docker network — use a real CA cert + verify_peer in prod.
auth_oauth2.jwks_uri = https://traefik/auth/realms/amqp-demo/protocol/openid-connect/certs
auth_oauth2.https.peer_verification = verify_none
auth_oauth2.https.hostname_verification = none

## Display a readable name for OAuth2 connections in the management UI and logs. Keycloak's
## client_credentials tokens carry the client id in `azp` (e.g. "dispatcher"); without this the
## broker falls back to the token's `sub` (an opaque service-account UUID).
auth_oauth2.preferred_username_claims.1 = azp

## Scope aliases — map short Keycloak scope names to RabbitMQ native permission scopes. This keeps
## Keycloak configuration readable while preserving RabbitMQ's native {permission}:{vhost}/{resource}
## format. The optional 3rd segment on the write scopes restricts the routing key (glob match — "job.*"
## means "routing key starting with job."), so the routing key itself becomes load-bearing for authz.
auth_oauth2.scope_aliases.jobs_write = rabbitmq.write:*/jobs/job.*
auth_oauth2.scope_aliases.jobs_read = rabbitmq.read:*/jobs.in rabbitmq.configure:*/jobs.in
auth_oauth2.scope_aliases.results_write = rabbitmq.write:*/results/result.*
auth_oauth2.scope_aliases.results_read = rabbitmq.read:*/results.out rabbitmq.configure:*/results.out

## Load the exchange/queue/binding topology on every boot
load_definitions = /etc/rabbitmq/definitions.json
